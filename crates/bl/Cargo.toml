[package]
name = "bracketlint"
version = "0.1.0"
description = "A linter and formatter for Django, Jinja, Liquid, Nunjucks and Twig templates"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
bl_arena = { workspace = true }
bl_ast = { workspace = true }
bl_fmt = { workspace = true }
bl_lints = { workspace = true }
bl_parse = { workspace = true }
bl_reporting = { workspace = true }
bl_utils = { workspace = true }
bl_workspace = { workspace = true }

anyhow = { workspace = true }
argfile = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
colored = { workspace = true }
ignore = { workspace = true }
log = { workspace = true }
mimalloc = { workspace = true }
wild = { workspace = true}
once_cell = { workspace = true }
