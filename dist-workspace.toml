[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. npm isn't one: dist's npm package
# downloads the binary in a `postinstall` script, so `just publish-npm` builds
# our own instead, a package per platform from the archives, and
# `@feds01/bracketlint`, which depends on them all.
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap that the formula is published to: `brew install feds01/tap/bracketlint`
tap = "feds01/homebrew-tap"
# Publish the Homebrew formula and the npm packages with each release, by our
# own jobs, which run `just publish-formula` and `just publish-npm`. The npm
# packages are staged with npm's trusted publishing, without a token, and go
# live once a maintainer approves them.
publish-jobs = ["./publish-homebrew", "./publish-npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Only run the release workflow for release tags, never on PRs
pr-run-mode = "skip"

# The permissions of our publish jobs. The Homebrew job pushes to the tap with
# its own token. npm's trusted publishing needs an OIDC token, and npm trusts
# any job in the release workflow that has one, so only the npm job gets one.
[dist.github-custom-job-permissions]
"publish-homebrew" = { contents = "read" }
"publish-npm" = { contents = "read", id-token = "write" }

# The versions of the GitHub actions that the release workflow uses
[dist.github-action-commits]
# v7.0.1
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
