name: CodSpeed

on:
  # Every commit on `main` is measured, as the baseline that PRs compare to.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the code that the benchmarks build, i.e. every crate except the CLI.
    paths:
      - "crates/**"
      - "!crates/bl/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/codspeed.yml"
  # Lets CodSpeed backfill results for earlier commits
  workflow_dispatch:

# A new push to a PR cancels its earlier run, but every run on `main` finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # to authenticate with CodSpeed through OpenID Connect

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install

      - name: Dependency caching
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          # Keep in step with `codspeed-divan-compat` in crates/bl_benchmark/Cargo.toml
          tool: cargo-codspeed@5.0.2

      - name: Build the benchmarks
        run: cargo codspeed build -m simulation -m memory -p bl_benchmark -p bl_benches

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation,memory
          run: cargo codspeed run -p bl_benchmark -p bl_benches
