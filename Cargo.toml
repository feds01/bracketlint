[workspace]
members = [
  "crates/bl*",
  "tests",
  "tests/testing-internal",
  "tests/testing-macros",
]

resolver = "2"

[workspace.package]
authors = ["Alexander Fedotov <alexander.fedotov.uk@gmail.com>"]
edition = "2024"


[workspace.dependencies]
bl_ast  = {  path = "crates/bl_ast" }
bl_ast_utils = { path = "crates/bl_ast_utils" }
bl_fmt = { path = "crates/bl_fmt" }
bl_lexer = { path = "crates/bl_lexer" }
bl_lints = { path = "crates/bl_lints" }
bl_macros = { path = "crates/bl_macros" }
bl_parse = { path = "crates/bl_parse" }
bl_reporting = { path = "crates/bl_reporting" }
bl_utils = { path = "crates/bl_utils" }
bl_workspace = { path = "crates/bl_workspace" }

annotate-snippets = { version = "0.12.4" }
anyhow = { version = "1.0.100" }
argfile = { version = "0.2.1" }
bitflags = { version = "2.9.4" }
bytecount = { version = "0.6.9" }
clap = { version = "4.5.48", features = ["derive"] }
colored = { version = "3.0.0" }
convert_case ="0.8"
crossbeam-channel = "0.5.15"
dashmap = "6.1"
derive_more = { version = "2", features = ["constructor", "deref"] }
globset = "0.4.16"
ignore = "0.4.23"
index_vec = "0.1.4"
itertools = "0.14.0"
line-span = "0.1.5"
log = { version = "0.4", features = ["kv_unstable", "kv_serde"] }
num-derive = "0.4.2"
num-traits = "0.2.19"
once_cell = "1.21.3"
parking_lot = "0.12"
path-absolutize = "3.1.1"
phf = { version = "0.13", features = ["macros"] }
proc-macro-error = "1.0.4"
proc-macro2 = "1.0.101"
quote = "1.0"
regex = "1.11.0"
replace_with = "0.1.8"
schemars = { version = "1.0.4", features = ["indexmap2"] }
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
similar = { version = "2.7.0", features = ["inline"] }
strum_macros = "0.27"
syn = { version = "2.0", features = ["extra-traits", "full"] }
thin-vec = "0.2.14"
wild = { version = "2" }

[profile.release]
opt-level = 3
lto = "fat"
debug-assertions = false
overflow-checks = false

# strip any symbols from the executable, this makes backtraces un-readable
strip = false

# set debug to true when profiling
debug = false
