[workspace]
members = [
  "crates/bl*",
]

resolver = "2"

[workspace.package]
authors = ["Alexander Fedotov <alexander.fedotov.uk@gmail.com>"]
edition = "2024"


[workspace.dependencies]
bl_ast  = {  path = "crates/bl_ast" }
bl_lexer = { path = "crates/bl_lexer" }
bl_lints = { path = "crates/bl_lints" }
bl_macros = { path = "crates/bl_macros" }
bl_parse = { path = "crates/bl_parse" }
bl_reporting = { path = "crates/bl_reporting" }
bl_utils = { path = "crates/bl_utils" }
bl_workspace = { path = "crates/bl_workspace" }

annotate-snippets = { version = "0.11.4" }
anyhow = { version = "1.0.80" }
argfile = { version = "0.2.0" }
bitflags = { version = "2.5.0" }
clap = { version = "4.5.3", features = ["derive"] }
colored = { version = "2.1.0" }
convert_case ="0.4"
crossbeam-channel = "0.5.1"
dashmap = "5.1"
derive_more = "0.99.18"
globset = "0.4.14"
ignore = "0.4.22"
index_vec = "0.1.3"
itertools = "0.13.0"
line-span = "0.1.5"
log = { version = "0.4", features = ["kv_unstable", "kv_serde"] }
num-derive = "0.4.0"
num-traits = "0.2.16"
once_cell = "1.19.0"
parking_lot = "0.12"
path-absolutize = "3.1.1"
phf = { version = "0.11", features = ["macros"] }
proc-macro2 = "1.0.63"
quote = "1.0"
replace_with = "0.1.7"
schemars = { version = "0.8.16", features = ["indexmap1"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
strum_macros = "0.21"
syn = { version = "1.0", features = ["extra-traits", "full"] }
thin-vec = "0.2.13"
wild = { version = "2" }

[profile.release]
opt-level = 3
lto = "fat"
debug-assertions = false
overflow-checks = false

# strip any symbols from the executable, this makes backtraces un-readable
strip = false

# set debug to true when profiling
debug = false
